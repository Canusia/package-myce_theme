[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myce_theme"
version = "2026.1.6"
authors = [
  { name="Avinash Kadaji", email="avi@canusia.com" },
]
description = "MYCE - Themes"
readme = "README.md"
requires-python = ">=3.8"
# Dependencies live here, not in setup.cfg: with a [project] table that does
# not list them (or mark them dynamic), setuptools ignores install_requires.
# myce_cis>=0.1.5a: templates load the `brand` tag library (package-cis #61);
# an older cis is a TemplateSyntaxError at render time.
dependencies = [
    "Django>=3.2",
    "myce_cis>=0.1.5a",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/Canusia/myce_theme"
"Bug Tracker" = "https://github.com/pypa/sampleproject/issues"